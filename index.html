<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>简约单页网站</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

<!-- 导航栏 -->
<header class="sticky top-0 bg-white shadow-sm z-50">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">
    <a href="#" class="text-xl font-bold text-blue-600">LOGO</a>
    <nav class="hidden md:flex gap-6">
      <a href="#home" class="hover:text-blue-600">首页</a>
      <a href="#about" class="hover:text-blue-600">关于</a>
      <a href="#service" class="hover:text-blue-600">服务</a>
      <a href="#contact" class="hover:text-blue-600">联系</a>
    </nav>
    <button class="md:hidden text-xl">
      <i class="fa fa-bars"></i>
    </button>
  </div>
</header>

<!-- Banner -->
<section id="home" class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white py-20 md:py-32">
  <div class="container mx-auto px-4 text-center">
    <h1 class="text-3xl md:text-5xl font-bold mb-4">打造优质体验</h1>
    <p class="text-lg md:text-xl opacity-90 mb-8 max-w-2xl mx-auto">专注于简洁、高效、美观的设计与开发，满足各类场景需求</p>
    <a href="#contact" class="inline-block bg-white text-blue-600 font-medium px-6 py-3 rounded-full shadow hover:shadow-lg transition">立即咨询</a>
  </div>
</section>

<!-- 关于我们 -->
<section id="about" class="py-16 bg-white">
  <div class="container mx-auto px-4">
    <div class="text-center mb-12">
      <h2 class="text-2xl md:text-3xl font-bold mb-2">关于我们</h2>
      <p class="text-gray-500">了解更多关于团队与理念</p>
    </div>
    <div class="max-w-3xl mx-auto text-center leading-relaxed">
      <p>我们是一支年轻且富有创造力的团队，坚持以用户为中心，注重细节与体验，致力于为客户提供可靠、易用、高颜值的产品与服务。</p>
    </div>
  </div>
</section>

<!-- 服务 -->
<section id="service" class="py-16 bg-gray-50">
  <div class="container mx-auto px-4">
    <div class="text-center mb-12">
      <h2 class="text-2xl md:text-3xl font-bold mb-2">服务项目</h2>
      <p class="text-gray-500">我们提供的核心服务</p>
    </div>
    <div class="grid md:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-xl shadow-sm hover:shadow-md transition">
        <i class="fa fa-code text-blue-600 text-3xl mb-4"></i>
        <h3 class="text-xl font-semibold mb-2">前端开发</h3>
        <p class="text-gray-500">响应式网页、交互效果、适配多终端</p>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm hover:shadow-md transition">
        <i class="fa fa-paint-brush text-blue-600 text-3xl mb-4"></i>
        <h3 class="text-xl font-semibold mb-2">UI设计</h3>
        <p class="text-gray-500">界面设计、品牌视觉、用户体验优化</p>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm hover:shadow-md transition">
        <i class="fa fa-server text-blue-600 text-3xl mb-4"></i>
        <h3 class="text-xl font-semibold mb-2">部署维护</h3>
        <p class="text-gray-500">网站上线、域名配置、持续维护</p>
      </div>
    </div>
  </div>
</section>

<!-- 联系 -->
<section id="contact" class="py-16 bg-white">
  <div class="container mx-auto px-4">
    <div class="text-center mb-12">
      <h2 class="text-2xl md:text-3xl font-bold mb-2">联系我们</h2>
      <p class="text-gray-500">随时与我们取得沟通</p>
    </div>
    <div class="max-w-md mx-auto">
      <form class="space-y-4">
        <input type="text" placeholder="您的姓名" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="email" placeholder="您的邮箱" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <textarea rows="4" placeholder="留言内容" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        <button class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition">提交</button>
      </form>
    </div>
  </div>
</section>

<!-- 底部 -->
<footer class="bg-gray-800 text-white py-8">
  <div class="container mx-auto px-4 text-center">
    <p>© 2025 简约单页网站 版权所有</p>
  </div>
</footer>

</body>
</html>
